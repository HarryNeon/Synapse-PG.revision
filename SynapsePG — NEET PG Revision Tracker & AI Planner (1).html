    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-card {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.7; }
      70% { transform: scale(1.1); opacity: 0; }
      100% { transform: scale(1.1); opacity: 0; }
    }
    .ai-pulse::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 9999px;
      border: 2px solid #9c88ff;
      animation: pulse-ring 2.2s infinite;
      pointer-events: none;
    }

      transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);

  const pad = (n) => String(n).padStart(2, '0');
  const todayISO = () => {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  };
  const addDaysISO = (iso, delta) => {
    const [y, m, d] = iso.split('-').map(Number);
    const dt = new Date(y, m - 1, d + delta);
    return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
  };
  const formatNiceDate = (iso) => {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
  };

    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
  };

  // ---------- STATE MANAGEMENT ----------
  const STORAGE_KEY = 'synapse_pg_state_v1';

  function createDefaultState() {
    const today = todayISO();
    const [y, m] = today.split('-').map(Number);
    return {
      theme: 'dark',
      userName: 'Doctor',
      examDate: '',
      inicetDate: '',
      targetRevisions: 3,
      weeklyGoal: 10,
      activeNav: 'dashboard',
      subjectSource: 'BTR',
      subjectFilter: 'all',
      subjectSort: 'default',
      subjectSearch: '',
      showSubjectSearch: false,
      plannerTab: 'todo',
      plannerDate: today,
      suggestFilter: 'All',
      calendarMonth: { year: y, month: m - 1 },
      activeCycleId: 'cycle_1',
      cycles: [
        { id: 'cycle_1', name: 'Cycle 1 (Main)', createdAt: today }
      ],
      customSubjects: [],
      archivedIds: [],
      // Per-cycle progress: { [cycleId]: { [subjectId]: { count: number, lastRevised: iso } } }
      progress: { cycle_1: {} },
      // Revision log entries: [{ id, cycleId, subjectId, subjectName, source, date }]
      revisionLog: [],
      // Planned tasks: [{ id, date, subjectId, subjectName, source, done }]
      planned: [],
      // Flashcards: [{ id, subjectId, subjectName, front, back, image, box, nextReview }]
      flashcards: [],
      // Notes: [{ id, date, type, subject, text, color, pinned, archived }]
      notes: [],
      // Tests: [{ id, title, type, date, subject, maxMarks, score, status }]
      tests: [],
      // Mistakes: [{ id, subject, question, takeaway, image, revisited, date }]
      mistakes: [],
      // OMR history: [{ id, title, total, correct, wrong, skipped, score, date }]
      omrHistory: [],
    };
  }

  let state = loadState();

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return createDefaultState();
      const parsed = JSON.parse(raw);
      return { ...createDefaultState(), ...parsed };
    } catch (e) {
      return createDefaultState();
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      // Ignore storage quota errors in restricted frames
    }
  }

  // ---------- SUBJECT HELPERS ----------
  function getAllSubjects() {
    return [...SEED_SUBJECTS, ...state.customSubjects];
  }

  function getActiveCycleProgress() {
    if (!state.progress[state.activeCycleId]) state.progress[state.activeCycleId] = {};
    return state.progress[state.activeCycleId];
  }

  function getSubjectCount(subId) {
    const p = getActiveCycleProgress();
    return p[subId]?.count || 0;
  }

  function markSubjectRevised(subId, delta = 1) {
    const sub = getAllSubjects().find(s => s.id === subId);
    if (!sub) return;
    const p = getActiveCycleProgress();
    const cur = p[subId] || { count: 0, lastRevised: null };
    const nextCount = Math.max(0, cur.count + delta);
    const today = todayISO();
    p[subId] = { count: nextCount, lastRevised: nextCount > 0 ? today : cur.lastRevised };

    if (delta > 0) {
      state.revisionLog.unshift({
        id: 'log_' + Date.now() + Math.random().toString(36).slice(2, 6),
        cycleId: state.activeCycleId,
        subjectId: sub.id,
        subjectName: sub.name,
        source: sub.source,
        date: today
      });
      // Also mark any planned item for today as done
      state.planned.forEach(item => {
        if (item.subjectId === subId && item.date === today) item.done = true;
      });
      showToast(`Revised ${sub.name} (${nextCount}x)`, 'success');
    } else {
      showToast(`Updated ${sub.name} to ${nextCount}x`, 'info');
    }
    saveState();
    render();
  }

  function scheduleSubject(subId, dateISO) {
    const sub = getAllSubjects().find(s => s.id === subId);
    if (!sub) return;
    const exists = state.planned.some(p => p.subjectId === subId && p.date === dateISO);
    if (exists) {
      showToast(`${sub.name} already planned for ${formatShortDate(dateISO)}`, 'info');
      return;
    }
    state.planned.push({
      id: 'pl_' + Date.now() + Math.random().toString(36).slice(2, 6),
      date: dateISO,
      subjectId: sub.id,
      subjectName: sub.name,
      source: sub.source,
      done: false
    });
    saveState();
    showToast(`Planned ${sub.name} for ${formatShortDate(dateISO)}`, 'success');
    render();
  }

  function getStreakDays() {
    const dates = new Set(state.revisionLog.map(l => l.date));
    let streak = 0;
    let cursor = todayISO();
    if (!dates.has(cursor)) {
      cursor = addDaysISO(cursor, -1);
    }
    while (dates.has(cursor)) {
      streak++;
      cursor = addDaysISO(cursor, -1);
    }
    return streak;
  }

  // ---------- THEME & TOAST ----------
  function applyTheme() {
    const html = document.documentElement;
    if (state.theme === 'dark') html.classList.add('dark');
    else html.classList.remove('dark');
  }

  function showToast(msg, type = 'info') {
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    const bg = type === 'success'
      ? 'bg-emerald-600 text-white'
      : type === 'error'
        ? 'bg-rose-600 text-white'
        : 'bg-slate-900 dark:bg-white text-white dark:text-slate-900';
    el.className = `${bg} px-4 py-2.5 rounded-2xl shadow-xl text-xs font-semibold text-center transition-all duration-300 transform translate-y-0 opacity-100`;
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => {
      el.classList.add('opacity-0', '-translate-y-2');
      setTimeout(() => el.remove(), 300);
    }, 2400);
  }

  // ---------- MODAL HELPERS ----------
  const modalRoot = document.getElementById('modal-root');
  const modalBox = document.getElementById('modal-box');

  function openModal(html, onBind) {
    modalBox.innerHTML = html;
    modalRoot.classList.remove('hidden');
    modalRoot.classList.add('flex');

    const marrow = bySource('Marrow');

  // ---------- SUBJECTS VIEW ----------
  function renderSubjects() {
    const src = state.subjectSource;
    const allForSrc = getAllSubjects().filter(s => s.source === src);
    const activeSubs = allForSrc.filter(s => !state.archivedIds.includes(s.id));
    const pendingSubs = activeSubs.filter(s => getSubjectCount(s.id) === 0);
    const doneSubs = activeSubs.filter(s => getSubjectCount(s.id) > 0);
    const archivedSubs = allForSrc.filter(s => state.archivedIds.includes(s.id));

    let list = activeSubs;
    if (state.subjectFilter === 'pending') list = pendingSubs;
    else if (state.subjectFilter === 'done') list = doneSubs;
    else if (state.subjectFilter === 'archived') list = archivedSubs;

    if (state.subjectSearch.trim()) {
      const q = state.subjectSearch.toLowerCase();
      list = list.filter(s => s.name.toLowerCase().includes(q) || s.group.toLowerCase().includes(q));
    }

    if (state.subjectSort === 'least') list = [...list].sort((a, b) => getSubjectCount(a.id) - getSubjectCount(b.id));
    else if (state.subjectSort === 'most') list = [...list].sort((a, b) => getSubjectCount(b.id) - getSubjectCount(a.id));
    else if (state.subjectSort === 'alpha') list = [...list].sort((a, b) => a.name.localeCompare(b.name));

    // Group by group name preserving order
    const groups = {};
    list.forEach(s => {
      if (!groups[s.group]) groups[s.group] = [];
      groups[s.group].push(s);
    });

    const isCustomEmpty = src === 'Custom' && allForSrc.length === 0;

    return `
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-extrabold">Subjects</h2>
        <div class="flex items-center gap-2">
          <button id="btn-toggle-sub-search" class="w-9 h-9 rounded-full bg-white dark:bg-[#14141d] border border-slate-200 dark:border-white/10 flex items-center justify-center">
            <i data-lucide="search" class="w-4 h-4 text-brand-500"></i>
          </button>
          ${src === 'Custom' ? `<button id="btn-add-custom-top" class="px-3 py-1.5 rounded-full bg-brand-500 text-white text-xs font-semibold">+ Add</button>` : ''}
        </div>
      </div>

      ${state.showSubjectSearch ? `
        <div class="relative">
          <input id="input-sub-search" type="text" value="${state.subjectSearch}" placeholder="Search subjects..." class="w-full px-4 py-2.5 rounded-2xl bg-white dark:bg-[#14141d] border border-slate-200 dark:border-white/10 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
        </div>
      ` : ''}

      <!-- Segmented Source Tabs -->
      <div class="grid grid-cols-3 p-1 rounded-2xl bg-slate-200/80 dark:bg-[#14141d] border border-slate-200/50 dark:border-white/5">
        ${['Marrow', 'BTR', 'Custom'].map(s => `
          <button data-sub-src="${s}" class="py-2 px-2 rounded-xl text-xs font-bold transition ${src === s ? 'bg-white dark:bg-white/10 shadow text-slate-900 dark:text-white' : 'text-slate-500 dark:text-slate-400'}">
            ${s === 'Custom' ? 'My subjects<span class="block text-[10px] font-normal opacity-70">Custom</span>' : s}
          </button>
        `).join('')}
      </div>

      <!-- Filter Pills -->
      <div class="grid grid-cols-4 p-1 rounded-2xl bg-slate-200/70 dark:bg-[#14141d]">
        ${[
          { id: 'all', label: 'All', count: activeSubs.length },
          { id: 'pending', label: 'Pending', count: pendingSubs.length },
          { id: 'done', label: 'Done', count: doneSubs.length },
          { id: 'archived', label: 'Archived', count: archivedSubs.length }
        ].map(f => `
          <button data-sub-filter="${f.id}" class="py-1.5 rounded-xl text-center transition ${state.subjectFilter === f.id ? 'bg-white dark:bg-white/10 shadow text-brand-600 dark:text-brand-300 font-bold' : 'text-slate-500 dark:text-slate-400 font-medium'}">
            <div class="text-xs">${f.label}</div>
            <div class="text-[11px]">${f.count}</div>
          </button>
        `).join('')}
      </div>

      <!-- Sort Bar -->
      <div class="flex items-center justify-between px-3.5 py-2.5 rounded-2xl bg-white dark:bg-[#14141d] border border-slate-200/80 dark:border-white/10 text-xs">
        <div class="flex items-center gap-2">
          <i data-lucide="arrow-up-down" class="w-3.5 h-3.5 text-slate-400"></i>
          <span class="text-slate-400">Sort</span>
          <select id="select-sub-sort" class="bg-transparent font-bold focus:outline-none">
            <option value="default" ${state.subjectSort === 'default' ? 'selected' : ''}>Default order</option>
            <option value="least" ${state.subjectSort === 'least' ? 'selected' : ''}>Least revised</option>
            <option value="most" ${state.subjectSort === 'most' ? 'selected' : ''}>Most revised</option>
            <option value="alpha" ${state.subjectSort === 'alpha' ? 'selected' : ''}>A – Z</option>
          </select>
        </div>
        <span class="text-slate-400 font-medium">${list.length} subjects</span>
      </div>

      ${isCustomEmpty ? `
        <div class="rounded-3xl bg-white dark:bg-[#14141d] border border-slate-200/80 dark:border-white/10 p-8 text-center space-y-3">
          <div class="w-12 h-12 rounded-2xl bg-brand-50 dark:bg-brand-500/15 text-brand-600 dark:text-brand-300 flex items-center justify-center mx-auto">
            <i data-lucide="plus" class="w-6 h-6"></i>
          </div>
          <h3 class="text-base font-bold">Add your first custom subject</h3>
          <p class="text-xs text-slate-500 dark:text-slate-400 max-w-xs mx-auto">Create your own subjects, like a coaching module or a test series, and track their revisions here.</p>
          <button id="btn-add-custom-empty" class="px-5 py-2.5 rounded-full bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold shadow-lg shadow-brand-500/25">+ Add custom subject</button>
        </div>
      ` : Object.keys(groups).length === 0 ? `
        <div class="rounded-3xl bg-white dark:bg-[#14141d] border border-slate-200/80 dark:border-white/10 p-8 text-center text-xs text-slate-400">
          No subjects match this filter.
        </div>
      ` : Object.entries(groups).map(([gName, items]) => {
        const gDone = items.filter(i => getSubjectCount(i.id) > 0).length;
        return `
          <div class="space-y-2.5 pt-1">
            <div class="flex items-center justify-between px-1 text-xs font-semibold text-slate-500 dark:text-slate-400">
              <span>${gName}</span>
              <span>${gDone}/${items.length} revised</span>
            </div>
            ${items.map(s => {
              const cnt = getSubjectCount(s.id);
              const colorCls = COLOR_MAP[s.color] || COLOR_MAP.indigo;
              return `
                <div class="rounded-2xl bg-white dark:bg-[#14141d] border border-slate-200/80 dark:border-white/10 p-3.5 flex items-center justify-between gap-3">
                  <div class="flex items-center gap-3 min-w-0">
                    <div class="w-10 h-10 rounded-xl ${colorCls} flex items-center justify-center shrink-0">
                      <i data-lucide="${s.icon || 'book'}" class="w-4 h-4"></i>
                    </div>
                    <div class="min-w-0">
                      <div class="text-sm font-bold truncate">${s.name}</div>
                      <button data-mark-rev="${s.id}" class="mt-1 px-2.5 py-0.5 rounded-full bg-slate-100 dark:bg-white/10 hover:bg-brand-500 hover:text-white text-[11px] font-semibold italic transition">Mark revised</button>
                    </div>
                  </div>
                  <div class="flex items-center gap-2 shrink-0">
                    <span class="w-7 h-7 rounded-full border border-slate-200 dark:border-white/15 flex items-center justify-center text-xs font-bold ${cnt > 0 ? 'bg-emerald-500/15 text-emerald-500 border-emerald-500/30' : ''}">${cnt}</span>
                    <button data-sub-menu="${s.id}" class="w-7 h-7 rounded-full hover:bg-slate-100 dark:hover:bg-white/10 flex items-center justify-center text-slate-400">
                      <i data-lucide="more-vertical" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }).join('')}
    `;
  }

  // ---------- PLANNER VIEW ----------
  function renderPlanner() {
    const today = todayISO();
    const daysLeft = state.examDate
      ? Math.max(0, Math.ceil((new Date(state.examDate) - new Date(today)) / 86400000))
      : null;

    const tabs = [
      { id: 'todo', label: 'To Do' },
      { id: 'catchup', label: 'Catch-up' },
      { id: 'suggest', label: 'Suggest' },
      { id: 'coverage', label: 'Coverage' },
      { id: 'tests', label: 'Tests' },
    ];

    let tabBody = '';
    if (state.plannerTab === 'todo') {
      const selDate = state.plannerDate;
      const weekDays = [-2, -1, 0, 1, 2, 3, 4].map(offset => {
        const iso = addDaysISO(selDate, offset);
        const [y, m, d] = iso.split('-').map(Number);
        const wd = new Date(y, m - 1, d).toLocaleDateString('en-IN', { weekday: 'short' });
        return { iso, d, wd };
      });
      const dayItems = state.planned.filter(p => p.date === selDate);
      const doneCount = dayItems.filter(p => p.done).length;

      tabBody = `
        <div class="flex items-center justify-between">
          <div>
            <h3 class="text-lg font-extrabold">${formatNiceDate(selDate)}</h3>
            <div class="text-xs text-slate-400">${selDate === today ? 'Today' : formatShortDate(selDate)}</div>
          </div>
          <div class="flex items-center gap-1.5">
            <button id="btn-planner-ai" class="px-3 py-1.5 rounded-full bg-brand-500/15 text-brand-600 dark:text-brand-300 text-xs font-bold flex items-center gap-1">
              <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> AI Bot
            </button>
            <button id="btn-planner-reset" title="Reset Plan" class="px-2.5 py-1.5 rounded-full bg-rose-500/10 text-rose-500 text-xs font-bold flex items-center gap-1 hover:bg-rose-500/20 transition">
              <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset
            </button>
            <input id="planner-date-picker" type="date" value="${selDate}" class="w-9 h-9 rounded-full bg-white dark:bg-[#14141d] border border-slate-200 dark:border-white/10 text-xs px-1 cursor-pointer">
          </div>
        </div>

        <div class="grid grid-cols-7 gap-1.5">
          ${weekDays.map(w => `
            <button data-plan-date="${w.iso}" class="py-2 rounded-2xl flex flex-col items-center transition ${w.iso === selDate ? 'bg-brand-600 text-white shadow-lg shadow-brand-500/25' : 'bg-white dark:bg-[#14141d] border border-slate-200/70 dark:border-white/5'}">
              <span class="text-[10px] opacity-75">${w.wd}</span>
              <span class="text-sm font-extrabold mt-0.5">${w.d}</span>
            </button>
          `).join('')}
        </div>

        <div class="space-y-1.5">
          <div class="text-xs font-bold">${doneCount} out of ${dayItems.length}</div>
          <div class="w-full h-1.5 rounded-full bg-slate-200 dark:bg-white/10 overflow-hidden">
            <div class="h-full bg-brand-500 transition-all" style="width:${dayItems.length ? Math.round((doneCount / dayItems.length) * 100) : 0}%"></div>
          </div>
        </div>

        ${dayItems.length === 0 ? `
          <div class="rounded-3xl bg-white dark:bg-[#14141d] border border-slate-200/80 dark:border-white/10 p-7 text-center space-y-3">
            <div class="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-white/5 flex items-center justify-center mx-auto text-2xl">📅</div>
            <div class="text-base font-bold">Nothing planned for ${selDate === today ? 'today' : 'this day'}</div>
            <p class="text-xs text-slate-500 dark:text-slate-400">Add a subject, upload a timetable to AI Bot, or let the planner suggest.</p>
            <div class="flex flex-wrap items-center justify-center gap-2.5 pt-1">
              <button id="btn-plan-add-sub" class="px-4 py-2.5 rounded-full bg-brand-600 text-white text-xs font-bold">Add subject</button>
              <button id="btn-plan-suggest-me" class="px-4 py-2.5 rounded-full bg-brand-100 dark:bg-brand-500/20 text-brand-700 dark:text-brand-300 text-xs font-bold">Suggest for me</button>
            </div>
          </div>
        ` : `
          <div class="space-y-2.5">
            ${dayItems.map(item => `
              <div class="rounded-2xl bg-white dark:bg-[#14141d] border border-slate-200/80 dark:border-white/10 p-3.5 flex items-center justify-between gap-3">
                <div class="flex items-center gap-3 min-w-0">
                  <button data-toggle-plan="${item.id}" class="w-6 h-6 rounded-lg border-2 flex items-center justify-center transition ${item.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 dark:border-white/25'}">
                    ${item.done ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}
                  </button>
                  <div class="min-w-0">
                    <div class="text-sm font-bold truncate ${item.done ? 'line-through opacity-50' : ''}">${item.subjectName}</div>
                    <div class="text-[11px] text-slate-400">${item.source}</div>
                  </div>
                </div>
                <button data-del-plan="${item.id}" class="w-8 h-8 rounded-full hover:bg-rose-500/15 text-slate-400 hover:text-rose-500 flex items-center justify-center">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            `).join('')}
            <button id="btn-plan-add-sub" class="w-full py-2.5 rounded-2xl border border-dashed border-brand-500/40 text-brand-500 text-xs font-bold">+ Add another subject</button>
          </div>
        `}
      `;
    } else if (state.plannerTab === 'catchup') {
      const overdue = state.planned.filter(p => p.date < today && !p.done);
      tabBody = `
        <div class="rounded-3xl bg-white dark:bg-[#14141d] border border-slate-200/80 dark:border-white/10 p-5">
          <div class="flex items-center justify-between mb-3">
            <div>
              <h3 class="text-base font-bold">Catch-up Queue</h3>
              <p class="text-xs text-slate-400">Missed subjects from past days</p>
            </div>
            ${overdue.length ? `<button id="btn-move-all-today" class="px-3 py-1.5 rounded-full bg-brand-600 text-white text-xs font-bold">Move all to Today</button>` : ''}
          </div>
          ${overdue.length === 0 ? `
            <div class="py-8 text-center text-xs text-slate-400">You're all caught up! No overdue revisions.</div>
          ` : `
            <div class="space-y-2">
              ${overdue.map(o => `
                <div class="p-3 rounded-2xl bg-slate-50 dark:bg-white/5 flex items-center justify-between">
                  <div>
                    <div class="text-sm font-bold">${o.subjectName}</div>
                    <div class="text-[11px] text-rose-400">Missed on ${formatShortDate(o.date)} • ${o.source}</div>
                  </div>
                  <button data-move-today="${o.id}" class="px-3 py-1 rounded-full bg-brand-500/15 text-brand-500 text-xs font-bold">Today</button>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    } else if (state.plannerTab === 'suggest') {
      let subs = getAllSubjects().filter(s => !state.archivedIds.includes(s.id));
      if (state.suggestFilter !== 'All') subs = subs.filter(s => s.source === state.suggestFilter);
      subs = [...subs].sort((a, b) => getSubjectCount(a.id) - getSubjectCount(b.id));

      tabBody = `
        <div>
          <h3 class="text-base font-bold">What to study next</h3>
          <p class="text-xs text-slate-400">Ranked on gaps, never-revised &amp; weak areas.</p>
        </div>

        <button id="btn-auto-plan-7" class="w-full rounded-2xl bg-brand-500/10 border border-brand-500/30 p-3.5 flex items-center justify-between text-left hover:bg-brand-500/20 transition">
          <div class="flex items-center gap-3">
            <span class="text-lg">⚡</span>
            <div>
              <div class="text-xs font-bold text-brand-700 dark:text-brand-300">Auto-plan my 7 days</div>
              <div class="text-[11px] text-slate-500 dark:text-slate-400">2/day • prioritizes unrevised subjects</div>
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-brand-400"></i>
        </button>

        <div class="flex gap-2">
          ${['All', 'Marrow', 'BTR'].map(f => `
            <button data-sug-filter="${f}" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition ${state.suggestFilter === f ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900' : 'bg-white dark:bg-[#14141d] border border-slate-200 dark:border-white/10 text-slate-500'}">${f}</button>
          `).join('')}
        </div>

        <div class="space-y-2">
          ${subs.slice(0, 20).map(s => {
            const cnt = getSubjectCount(s.id);
            const colorCls = COLOR_MAP[s.color] || COLOR_MAP.indigo;
            return `
              <div class="rounded-2xl bg-white dark:bg-[#14141d] border border-slate-200/80 dark:border-white/10 p-3 flex items-center justify-between">
                <div class="flex items-center gap-3 min-w-0">
                  <div class="w-9 h-9 rounded-xl ${colorCls} flex items-center justify-center shrink-0">
                    <i data-lucide="${s.icon || 'book'}" class="w-4 h-4"></i>
                  </div>
                  <div class="min-w-0">
                    <div class="text-sm font-bold truncate">${s.name}</div>
                    <div class="text-[11px] text-slate-400">${cnt === 0 ? 'Never revised' : `Revised ${cnt}x`} • ${s.source}</div>
                  </div>
                </div>
                <button data-quick-plan="${s.id}" class="px-3 py-1.5 rounded-full bg-brand-100 dark:bg-brand-500/20 text-brand-700 dark:text-brand-300 text-xs font-bold shrink-0">Plan +</button>
              </div>
            `;
          }).join('')}
        </div>
      `;
    } else if (state.plannerTab === 'coverage') {
      const allSubs = getAllSubjects().filter(s => !state.archivedIds.includes(s.id));
      const totalTargets = allSubs.length * state.targetRevisions;
      const doneTargets = allSubs.reduce((acc, s) => acc + Math.min(state.targetRevisions, getSubjectCount(s.id)), 0);
      const readinessPct = totalTargets ? Math.round((doneTargets / totalTargets) * 100) : 0;
      const revisedOnce = allSubs.filter(s => getSubjectCount(s.id) > 0).length;
      const avgRev = allSubs.length ? (allSubs.reduce((a, s) => a + getSubjectCount(s.id), 0) / allSubs.length).toFixed(1) : '0.0';
      const neverRevised = allSubs.filter(s => getSubjectCount(s.id) === 0);

      const groupBuckets = [
        { label: 'MARROW • 1st Year', src: 'Marrow', grp: '1st Year' },
        { label: 'MARROW • 2nd Year', src: 'Marrow', grp: '2nd Year' },
        { label: 'MARROW • 3rd Year', src: 'Marrow', grp: '3rd Year' },
        { label: 'MARROW • Final Year', src: 'Marrow', grp: 'Final Year' },
        { label: 'BTR • Short Subjects', src: 'BTR', grp: 'Short Subjects' },
        { label: 'BTR • Intermediate Subjects', src: 'BTR', grp: 'Intermediate Subjects' },
        { label: 'BTR • Long Subjects', src: 'BTR', grp: 'Long Subjects' },
        { label: 'BTR • Integrated Subjects', src: 'BTR', grp: 'Integrated Subjects' },
      ];

      tabBody = `
        <div class="rounded-3xl bg-white dark:bg-[#14141d] border border-slate-200/80 dark:border-white/10 p-5 space-y-3">
          <div class="flex items-start justify-between">
            <div>
              <h3 class="text-base font-bold">Exam readiness</h3>
              <p class="text-xs text-slate-400">${readinessPct}% of target revisions done</p>
            </div>
            <span class="px-2.5 py-1 rounded-full bg-brand-100 dark:bg-brand-500/20 text-brand-700 dark:text-brand-300 text-[11px] font-bold">
              ${daysLeft !== null ? `${daysLeft} days left` : 'No exam date'}
            </span>
          </div>
          <div class="w-full h-2 rounded-full bg-slate-100 dark:bg-white/10 overflow-hidden">
            <div class="h-full bg-brand-500" style="width:${readinessPct}%"></div>
          </div>
          <div class="space-y-1.5 text-xs pt-1">
            <div class="flex justify-between"><span class="text-slate-400">Target</span><span class="font-bold">${state.targetRevisions}x every subject</span></div>
            <div class="flex justify-between"><span class="text-slate-400">Revisions still needed</span><span class="font-bold">${Math.max(0, totalTargets - doneTargets)}</span></div>
            <div class="flex justify-between"><span class="text-slate-400">Daily pace needed</span><span class="font-bold">${daysLeft ? ((totalTargets - doneTargets) / Math.max(1, daysLeft)).toFixed(1) + '/day' : 'Set exam date'}</span></div>
          </div>
          ${!state.examDate ? `<button id="btn-set-exam-inline" class="px-4 py-2 rounded-full bg-brand-100 dark:bg-brand-500/20 text-brand-700 dark:text-brand-300 text-xs font-bold">Set exam date for a daily target</button>` : ''}
        </div>

        <div class="rounded-3xl bg-white dark:bg-[#14141d] border border-slate-200/80 dark:border-white/10 p-4 grid grid-cols-3 text-center">
          <div><div class="text-lg font-extrabold text-brand-500">${allSubs.length ? Math.round((revisedOnce / allSubs.length) * 100) : 0}%</div><div class="text-[11px] text-slate-400">coverage</div></div>
          <div><div class="text-lg font-extrabold text-brand-500">${revisedOnce}/${allSubs.length}</div><div class="text-[11px] text-slate-400">subjects revised</div></div>
          <div><div class="text-lg font-extrabold text-brand-500">${avgRev}</div><div class="text-[11px] text-slate-400">avg revisions</div></div>
        </div>

        <div class="space-y-2">
          <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 px-1">By Group</div>
          ${groupBuckets.map(b => {
            const items = allSubs.filter(s => s.source === b.src && s.group === b.grp);
            const done = items.filter(s => getSubjectCount(s.id) > 0).length;
            const gp = items.length ? Math.round((done / items.length) * 100) : 0;
            return `
              <div class="rounded-2xl bg-white dark:bg-[#14141d] border border-slate-200/80 dark:border-white/10 p-3.5">
                <div class="flex justify-between text-xs font-bold mb-2">
                  <span>${b.label}</span>
                  <span class="text-slate-400">${done}/${items.length}</span>
                </div>
                <div class="w-full h-1.5 rounded-full bg-slate-100 dark:bg-white/10 overflow-hidden">
                  <div class="h-full bg-brand-500" style="width:${gp}%"></div>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="space-y-2">
          <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 px-1">Never Revised (${neverRevised.length})</div>
          <div class="flex flex-wrap gap-2">
            ${neverRevised.slice(0, 14).map(s => `
              <button data-quick-plan="${s.id}" class="px-3 py-1.5 rounded-full bg-white dark:bg-[#14141d] border border-slate-200 dark:border-white/10 text-xs font-semibold hover:border-brand-500 transition">${s.name}</button>
            `).join('')}
          </div>
        </div>
      `;
    } else if (state.plannerTab === 'tests') {
      tabBody = `
        <div class="rounded-3xl bg-white dark:bg-[#14141d] border border-slate-200/80 dark:border-white/10 p-5 text-center space-y-3">
          <div class="text-base font-bold">${state.tests.length} Tests Logged</div>
          <p class="text-xs text-slate-400">Track Grand Tests, Subject Tests, and score trends.</p>
          <button id="btn-open-tests-full" class="px-5 py-2.5 rounded-full bg-emerald-600 text-white text-xs font-bold">Open Tests Tracker</button>
        </div>
      `;
    }

    return `
      <h2 class="text-xl font-extrabold">Planner</h2>

      <!-- Goal Card -->
      <div class="rounded-3xl bg-white dark:bg-[#14141d] border border-slate-200/80 dark:border-white/10 p-4 flex items-center justify-between">
        <div>

  function renderOMRView(backHeader) {
    let rows = '';

  function openAIPlannerModal() {
    const today = todayISO();
    openModal(`
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-brand-600 text-white flex items-center justify-center"><i data-lucide="sparkles" class="w-4 h-4"></i></div>

        </div>

        <label class="block rounded-2xl border-2 border-dashed border-brand-500/40 bg-brand-500/5 p-4 text-center cursor-pointer hover:bg-brand-500/10 transition">
          <i data-lucide="image-plus" class="w-6 h-6 text-brand-500 mx-auto mb-1"></i>
          <div class="text-xs font-bold text-brand-600 dark:text-brand-300">Upload Timetable / Schedule Image</div>
          <div class="text-[11px] text-slate-400">PNG, JPG screenshot — OCR extracts subjects &amp; dates</div>
          <input id="ai-img-input" type="file" accept="image/*" class="hidden">
        </label>

        <div id="ai-img-preview-wrap" class="hidden rounded-2xl overflow-hidden border border-slate-200 dark:border-white/10 bg-black/20 p-2">
          <img id="ai-img-preview" class="max-h-36 mx-auto rounded-xl object-contain" alt="Uploaded schedule">
          <div id="ai-ocr-status" class="text-[11px] text-center text-brand-400 font-semibold mt-1.5"></div>
        </div>

        <div>
          <label class="text-[11px] font-bold text-slate-400">Or describe your calendar edit</label>
          <textarea id="ai-prompt-input" rows="2" placeholder="e.g. Plan Anatomy and Physiology for tomorrow, Pathology on 2026-11-24" class="mt-1 w-full rounded-2xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 p-3 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
        </div>

        <button id="ai-parse-btn" class="w-full py-2.5 rounded-2xl bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold">Analyze &amp; Generate Calendar Plan</button>

        <div id="ai-results-wrap" class="hidden space-y-2 pt-2 border-t border-slate-200 dark:border-white/10">
          <div class="flex items-center justify-between text-xs font-bold">
            <span>Proposed Calendar Edits</span>
            <button id="ai-add-manual-row" class="text-brand-500">+ Add row</button>
          </div>
          <div id="ai-proposed-list" class="space-y-2 max-h-48 overflow-y-auto"></div>
          <button id="ai-apply-btn" class="w-full py-2.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold">Apply Selected to Calendar</button>
        </div>
      </div>
    `, (box) => {
      box.querySelector('#ai-close').addEventListener('click', closeModal);

      let proposed = [];

      function renderProposed() {
        const wrap = box.querySelector('#ai-results-wrap');
        const listEl = box.querySelector('#ai-proposed-list');
        wrap.classList.remove('hidden');
        const allSubs = getAllSubjects();
        listEl.innerHTML = proposed.map((p, idx) => `
          <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-white/5 flex items-center gap-2 text-xs">
            <input type="checkbox" data-ai-chk="${idx}" ${p.checked ? 'checked' : ''} class="accent-brand-600">
            <select data-ai-sub="${idx}" class="flex-1 bg-transparent font-semibold truncate focus:outline-none">
              ${allSubs.map(s => `<option value="${s.id}" ${s.id === p.subjectId ? 'selected' : ''}>${s.name} (${s.source})</option>`).join('')}
            </select>
            <input type="date" data-ai-date="${idx}" value="${p.date}" class="bg-transparent text-[11px] font-semibold">
          </div>
        `).join('');

        listEl.querySelectorAll('[data-ai-chk]').forEach(el => {
          el.addEventListener('change', (e) => { proposed[+e.target.dataset.aiChk].checked = e.target.checked; });
        });
        listEl.querySelectorAll('[data-ai-sub]').forEach(el => {
          el.addEventListener('change', (e) => { proposed[+e.target.dataset.aiSub].subjectId = e.target.value; });
        });
        listEl.querySelectorAll('[data-ai-date]').forEach(el => {
          el.addEventListener('change', (e) => { proposed[+e.target.dataset.aiDate].date = e.target.value; });
        });
      }

      function parseTextToPlan(text) {
        const lower = text.toLowerCase();
        const allSubs = getAllSubjects();
        const lines = text.split(/\n|;|,|\band\b/i).map(s => s.trim()).filter(Boolean);
        const found = [];

        let defaultDate = today;
        if (lower.includes('tomorrow')) defaultDate = addDaysISO(today, 1);

        lines.forEach((line, i) => {
          const l = line.toLowerCase();
          let dt = defaultDate;
          if (l.includes('today')) dt = today;
          else if (l.includes('tomorrow')) dt = addDaysISO(today, 1);
          const isoMatch = line.match(/\b(202\d-\d{2}-\d{2})\b/);
          if (isoMatch) dt = isoMatch[1];

          allSubs.forEach(sub => {
            const sName = sub.name.toLowerCase().replace(' integrated', '');
            if (l.includes(sName) && !found.some(f => f.subjectId === sub.id && f.date === dt)) {
              found.push({ subjectId: sub.id, date: dt, checked: true });
            }
          });
        });

        // Fallback: if nothing matched, suggest top 3 unrevised subjects
        if (found.length === 0) {
          const unrev = allSubs.filter(s => getSubjectCount(s.id) === 0).slice(0, 3);
          unrev.forEach((s, idx) => found.push({ subjectId: s.id, date: addDaysISO(today, idx), checked: true }));
          showToast('No exact subject names found — suggested 3 unrevised subjects to edit', 'info');
        }
        proposed = found;
        renderProposed();
      }

      box.querySelector('#ai-img-input').addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        box.querySelector('#ai-img-preview').src = url;
        box.querySelector('#ai-img-preview-wrap').classList.remove('hidden');
        const statusEl = box.querySelector('#ai-ocr-status');
        statusEl.textContent = 'Scanning image with AI OCR...';
        try {
          if (window.Tesseract) {
            const res = await Tesseract.recognize(file, 'eng');
            const txt = res.data.text || '';
            box.querySelector('#ai-prompt-input').value = txt.trim();
            statusEl.textContent = 'Image scanned! Review text or click Analyze.';
            parseTextToPlan(txt);
          } else {
            statusEl.textContent = 'OCR engine unavailable — add subjects below.';
            parseTextToPlan('');
          }
        } catch (err) {
          statusEl.textContent = 'Could not read image text — type or pick subjects below.';
          parseTextToPlan('');
        }
      });

      box.querySelector('#ai-parse-btn').addEventListener('click', () => {
        parseTextToPlan(box.querySelector('#ai-prompt-input').value);
      });

      box.querySelector('#ai-add-manual-row').addEventListener('click', () => {
        proposed.push({ subjectId: getAllSubjects()[0].id, date: today, checked: true });
        renderProposed();
      });

      box.querySelector('#ai-apply-btn').addEventListener('click', () => {
        let count = 0;
        proposed.filter(p => p.checked).forEach(p => {
          const sub = getAllSubjects().find(s => s.id === p.subjectId);
          if (sub && !state.planned.some(x => x.subjectId === sub.id && x.date === p.date)) {
            state.planned.push({
              id: 'pl_' + Date.now() + Math.random().toString(36).slice(2, 6),
              date: p.date,
              subjectId: sub.id,
              subjectName: sub.name,
              source: sub.source,
              done: false
            });
            count++;
          }
        });
        saveState();
        closeModal();
        showToast(`Added ${count} session(s) to calendar`, 'success');
        render();
      });
    });
  }

  // ---------- MAIN RENDER & EVENT BINDING ----------
  function render() {

    document.getElementById('user-name-display').textContent = state.userName || 'Doctor';
    const curCycle = state.cycles.find(c => c.id === state.activeCycleId);
    document.getElementById('header-cycle-badge').textContent = curCycle ? curCycle.name.split(' ')[0] + ' ' + (curCycle.name.split(' ')[1] || '') : 'Cycle 1';

    if (activeMenuView) {
      main.innerHTML = renderMenuView();
    } else if (state.activeNav === 'dashboard') {
      main.innerHTML = renderDashboard();
    } else if (state.activeNav === 'subjects') {
      main.innerHTML = renderSubjects();
    } else if (state.activeNav === 'planner') {
      main.innerHTML = renderPlanner();
    } else if (state.activeNav === 'flashcards') {
      main.innerHTML = renderFlashcards();
    } else if (state.activeNav === 'notes') {
      main.innerHTML = renderNotes();
    }

    // Update bottom nav active state
    document.querySelectorAll('.nav-btn').forEach(btn => {
      const isAct = !activeMenuView && btn.dataset.nav === state.activeNav;
      btn.className = `nav-btn flex-1 flex flex-col items-center justify-center py-1.5 rounded-full transition text-[11px] font-medium gap-0.5 ${isAct ? 'bg-brand-500/15 text-brand-600 dark:text-brand-300 font-bold' : 'text-slate-500 dark:text-slate-400'}`;

    bindViewEvents();
  }

        <div class="space-y-2 text-xs font-bold">
          ${dayCount ? `<button id="rp-day" class="w-full p-3 rounded-xl bg-amber-500/15 text-amber-500 text-left">Clear ${formatShortDate(targetDate)} (${dayCount} planned)</button>` : ''}
          <button id="rp-all" class="w-full p-3 rounded-xl bg-rose-500/15 text-rose-500 text-left">Reset All Calendar Plans (${totalCount} total)</button>
        </div>
      `, box => {
        box.querySelector('#m-close').addEventListener('click', closeModal);
        box.querySelector('#rp-day')?.addEventListener('click', () => {
          state.planned = state.planned.filter(p => p.date !== targetDate);
          saveState(); closeModal(); showToast(`Cleared plan for ${formatShortDate(targetDate)}`, 'info'); render();
        });
        box.querySelector('#rp-all').addEventListener('click', () => {
          state.planned = [];
          saveState(); closeModal(); showToast('All calendar plans reset', 'info'); render();
        });
      });
    };
    document.querySelectorAll('[data-edit-countdown]').forEach(b => b.addEventListener('click', openGoalModal));
    document.getElementById('btn-dash-reset-plan')?.addEventListener('click', () => openResetPlanModal(todayISO()));
    document.getElementById('btn-planner-reset')?.addEventListener('click', () => openResetPlanModal(state.plannerDate));
    document.getElementById('btn-exam-settings')?.addEventListener('click', openGoalModal);
    document.getElementById('btn-set-exam-inline')?.addEventListener('click', openGoalModal);
    document.getElementById('btn-open-tests-full')?.addEventListener('click', () => { activeMenuView = 'tests'; render(); });

    // Flashcards events
    document.getElementById('btn-new-fc')?.addEventListener('click', openAddFlashcardModal);
    document.getElementById('btn-new-fc-empty')?.addEventListener('click', openAddFlashcardModal);
    document.getElementById('fc-flip-trigger')?.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      flashcardFlipped = !flashcardFlipped;
      render();
    });
    document.getElementById('btn-fc-prev')?.addEventListener('click', () => { activeFlashcardIdx = (activeFlashcardIdx - 1 + state.flashcards.length) % state.flashcards.length; flashcardFlipped = false; render(); });
    document.getElementById('btn-fc-next')?.addEventListener('click', () => { activeFlashcardIdx = (activeFlashcardIdx + 1) % state.flashcards.length; flashcardFlipped = false; render(); });
    document.querySelectorAll('[data-fc-rate]').forEach(b => b.addEventListener('click', () => {
      activeFlashcardIdx = (activeFlashcardIdx + 1) % state.flashcards.length;
      flashcardFlipped = false;
      render();
    }));
    document.querySelectorAll('[data-fc-del]').forEach(b => b.addEventListener('click', () => {
      state.flashcards = state.flashcards.filter(c => c.id !== b.dataset.fcDel);
      flashcardFlipped = false; saveState(); render();
    }));

    // Notes events
    document.querySelectorAll('[data-note-chip]').forEach(b => b.addEventListener('click', () => { draftNoteType = b.dataset.noteChip; render(); }));
    document.querySelectorAll('[data-note-color]').forEach(b => b.addEventListener('click', () => { draftNoteColor = b.dataset.noteColor; render(); }));
    document.getElementById('btn-note-pin')?.addEventListener('click', () => { draftNotePinned = !draftNotePinned; render(); });
    document.getElementById('btn-toggle-notes-archive')?.addEventListener('click', () => { showNotesArchive = !showNotesArchive; render(); });
    document.getElementById('btn-save-note')?.addEventListener('click', () => {
      const txt = document.getElementById('note-input')?.value.trim();
      if (!txt) return showToast('Write something first', 'error');
      state.notes.unshift({ id: 'n_' + Date.now(), date: todayISO(), type: draftNoteType, text: txt, color: draftNoteColor, pinned: draftNotePinned, archived: false });
      saveState(); showToast('Note saved', 'success'); render();
    });
    document.querySelectorAll('[data-archive-note]').forEach(b => b.addEventListener('click', () => {
      const n = state.notes.find(x => x.id === b.dataset.archiveNote);
      if (n) { n.archived = !n.archived; saveState(); render(); }
    }));
    document.querySelectorAll('[data-del-note]').forEach(b => b.addEventListener('click', () => {
      state.notes = state.notes.filter(x => x.id !== b.dataset.delNote); saveState(); render();
    }));

    // Menu Sub-views events
    document.getElementById('btn-back-from-menu-view')?.addEventListener('click', () => { activeMenuView = null; render(); });
    document.getElementById('btn-add-cycle')?.addEventListener('click', () => {
      const num = state.cycles.length + 1;
      const id = 'cycle_' + Date.now();
      state.cycles.push({ id, name: `Cycle ${num}`, createdAt: todayISO() });
      state.activeCycleId = id;
      saveState(); showToast(`Switched to Cycle ${num}`, 'success'); render();
    });
    document.querySelectorAll('[data-switch-cycle]').forEach(b => b.addEventListener('click', () => { state.activeCycleId = b.dataset.switchCycle; saveState(); render(); }));
    document.querySelectorAll('[data-del-cycle]').forEach(b => b.addEventListener('click', () => {
      state.cycles = state.cycles.filter(c => c.id !== b.dataset.delCycle);
      if (state.activeCycleId === b.dataset.delCycle) state.activeCycleId = state.cycles[0].id;
      saveState(); render();
    }));

    // Tests
    document.querySelectorAll('[data-test-tab]').forEach(b => b.addEventListener('click', () => { testTab = b.dataset.testTab; render(); }));
    document.querySelectorAll('[data-test-filter]').forEach(b => b.addEventListener('click', () => { testFilter = b.dataset.testFilter; render(); }));
    document.querySelectorAll('[data-del-test]').forEach(b => b.addEventListener('click', () => { state.tests = state.tests.filter(t => t.id !== b.dataset.delTest); saveState(); render(); }));
    document.getElementById('btn-plan-test')?.addEventListener('click', () => {
      openModal(`
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-base font-bold">Plan / Log Test</h3>
          <button id="m-close" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-white/10 flex items-center justify-center"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="space-y-3 text-xs">
          <input id="t-title" type="text" placeholder="Test name (e.g. Marrow GT 12)" class="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10">
          <div class="grid grid-cols-2 gap-2">
            <select id="t-type" class="p-2.5 rounded-xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10">
              <option value="Grand">Grand</option><option value="Subject">Subject</option><option value="Topic">Topic</option>
            </select>
            <input id="t-date" type="date" value="${todayISO()}" class="p-2.5 rounded-xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input id="t-score" type="number" placeholder="Score (optional)" class="p-2.5 rounded-xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10">
            <input id="t-max" type="number" value="800" placeholder="Max Marks" class="p-2.5 rounded-xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10">
          </div>
          <button id="t-save" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-bold">Save Test</button>
        </div>
      `, box => {
        box.querySelector('#m-close').addEventListener('click', closeModal);
        box.querySelector('#t-save').addEventListener('click', () => {
          const title = box.querySelector('#t-title').value.trim();
          if (!title) return showToast('Enter test name', 'error');
          state.tests.unshift({
            id: 't_' + Date.now(),
            title,
            type: box.querySelector('#t-type').value,
            date: box.querySelector('#t-date').value || todayISO(),
            score: box.querySelector('#t-score').value,
            maxMarks: box.querySelector('#t-max').value || 800
          });
          saveState(); closeModal(); showToast('Test saved', 'success'); render();
        });
      });
    });

    if (activeMenuView === 'tests' && testTab === 'overview' && document.getElementById('test-score-chart')) {
      const scored = state.tests.filter(t => t.score !== '' && t.score !== null).reverse();
      new Chart(document.getElementById('test-score-chart'), {
        type: 'line',
        data: {
          labels: scored.map(t => t.title),
          datasets: [{ label: 'Score', data: scored.map(t => Number(t.score)), borderColor: '#10b981', tension: 0.3, fill: true, backgroundColor: 'rgba(16,185,129,0.12)' }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    // Mistakes
    document.getElementById('btn-add-mistake')?.addEventListener('click', () => {
      openModal(`
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-base font-bold">Log Mistake</h3>
          <button id="m-close" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-white/10 flex items-center justify-center"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="space-y-3 text-xs">
          <input id="mk-sub" type="text" placeholder="Subject (e.g. Pharmacology)" class="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10">
          <input id="mk-q" type="text" placeholder="Question / Topic" class="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10">
          <textarea id="mk-take" rows="3" placeholder="Correct concept / takeaway..." class="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10"></textarea>
          <button id="mk-save" class="w-full py-2.5 rounded-xl bg-rose-600 text-white font-bold">Save Mistake</button>
        </div>
      `, box => {
        box.querySelector('#m-close').addEventListener('click', closeModal);
        box.querySelector('#mk-save').addEventListener('click', () => {
          const question = box.querySelector('#mk-q').value.trim();
          if (!question) return showToast('Enter question or topic', 'error');
          state.mistakes.unshift({ id: 'mk_' + Date.now(), subject: box.querySelector('#mk-sub').value.trim() || 'General', question, takeaway: box.querySelector('#mk-take').value.trim(), date: todayISO() });
          saveState(); closeModal(); render();
        });
      });
    });
    document.querySelectorAll('[data-del-mistake]').forEach(b => b.addEventListener('click', () => { state.mistakes = state.mistakes.filter(m => m.id !== b.dataset.delMistake); saveState(); render(); }));

    // OMR
    document.querySelectorAll('[data-omr-q]').forEach(b => b.addEventListener('click', () => {
      omrAnswers[b.dataset.omrQ] = b.dataset.omrOpt;
      render();
    }));
    document.querySelectorAll('[data-omr-len]').forEach(b => b.addEventListener('click', () => { omrCount = Number(b.dataset.omrLen); render(); }));
    document.getElementById('btn-omr-clear')?.addEventListener('click', () => { omrAnswers = {}; render(); });

    // Account
    document.getElementById('btn-save-acc-name')?.addEventListener('click', () => {
      state.userName = document.getElementById('input-acc-name').value.trim() || 'Doctor';
      saveState(); showToast('Name updated', 'success'); render();
    });
    document.getElementById('btn-export-json')?.addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `synapsepg-backup-${todayISO()}.json`;
      a.click();
    });
    document.getElementById('input-import-json')?.addEventListener('change', (e) => {
      const f = e.target.files?.[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          state = { ...createDefaultState(), ...JSON.parse(r.result) };
          saveState(); showToast('Backup restored!', 'success'); render();
        } catch { showToast('Invalid backup file', 'error'); }
      };
      r.readAsText(f);
    });
    document.getElementById('btn-reset-all')?.addEventListener('click', () => {
      state = createDefaultState();
      saveState(); activeMenuView = null; showToast('All data reset', 'info'); render();
    });
  }

  // ---------- GLOBAL HEADER & DRAWER LISTENERS ----------
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeMenuView = null;
      state.activeNav = btn.dataset.nav;
      saveState();
      render();
    });
  });

  document.getElementById('btn-theme-toggle').addEventListener('click', () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    saveState();
    render();
  });

  document.getElementById('btn-quick-note').addEventListener('click', () => {
    activeMenuView = null;
    state.activeNav = 'notes';
    render();
  });

  document.getElementById('btn-open-ai').addEventListener('click', openAIPlannerModal);

  const menuDrawer = document.getElementById('menu-drawer');
  const closeMenu = () => menuDrawer.classList.add('hidden');
  document.getElementById('btn-open-menu').addEventListener('click', () => menuDrawer.classList.remove('hidden'));
  document.getElementById('btn-close-menu').addEventListener('click', closeMenu);
  document.getElementById('menu-backdrop').addEventListener('click', closeMenu);
  document.getElementById('btn-menu-ai').addEventListener('click', () => { closeMenu(); openAIPlannerModal(); });

  document.querySelectorAll('[data-menu-view]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeMenuView = btn.dataset.menuView;
      closeMenu();
      render();
    });
  });

  // Boot
  render();
})();
</script>
</body>
</html>
